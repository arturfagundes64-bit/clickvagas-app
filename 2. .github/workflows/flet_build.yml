name: Gerar APK - Flet Python

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o codigo
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias completas
      run: |
        python -m pip install --upgrade pip
        pip install flet-cli flet flet-charts qrcode

    - name: Configurar Flutter SDK Oficial
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'

    - name: Gerar o APK do Flet
      run: |
        flet build apk --yes --skip-flutter-doctor

    - name: Fazer o upload do APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: flet-app-apk
        path: build/apk/*.apk

